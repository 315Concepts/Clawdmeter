[package]
name = "clawdmeter-app"
description = "Clawdmeter desktop companion: daemon runtime, GPUI windows and tray."
version.workspace = true
edition.workspace = true
license.workspace = true
# tray-icon 0.26 / muda 0.21 need 1.90.
rust-version = "1.90"

[lib]
name = "clawdmeter_app"
path = "src/lib.rs"

[[bin]]
name = "clawdmeter"
path = "src/main.rs"

[dependencies]
clawdmeter-core.workspace = true
clawdmeter-ble.workspace = true
clawdmeter-flash.workspace = true
tokio.workspace = true
log.workspace = true
chrono.workspace = true
serde_json.workspace = true
serde.workspace = true
futures.workspace = true
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "wayland", "x11"] }

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
dbus = "0.9"
# Already in the tree through gpui: asks the compositor whether it draws
# window frames (xdg-decoration) before the window opens.
wayland-client = "0.31"

[target.'cfg(target_os = "windows")'.dependencies]
tray-icon = { version = "0.26", default-features = false }
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Console"] }

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "0.26", default-features = false }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSRunningApplication"] }
dispatch2 = "0.3"

[dev-dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "wayland", "x11", "test-support"] }
